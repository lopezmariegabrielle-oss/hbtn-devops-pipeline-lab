# ---------------------------------------------------------------------------
# Continuous integration for hbtn-devops-pipeline-lab.
#
# HEADS UP: this workflow is DELIBERATELY BROKEN. It ships with three separate
# faults of three different kinds, and repairing them one commit at a time is
# the pipeline-repair task.
#
# Read the run logs in the Actions tab and let them tell you where to look. Do
# not rewrite the file from scratch: the exercise is the diagnosis, not the
# typing. Each fault has its own signature, and fixing one only gets you as far
# as the next.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the tests
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: ./reports
          retention-days: 7

  build:
    name: Build and publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

      - name: Wait for the deployed service to become healthy
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          attempts=10
          delay=10

          check() {
            path="$1"
            i=1
            while [ "$i" -le "$attempts" ]; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "${STAGING_URL}${path}")
              if [ "$status" = "200" ]; then
                echo "${path} -> 200 (attempt ${i}/${attempts})"
                return 0
              fi
              echo "${path} -> ${status} (attempt ${i}/${attempts}), retrying in ${delay}s"
              sleep "$delay"
              i=$((i + 1))
            done
            echo "${path} never returned 200 after ${attempts} attempts"
            return 1
          }

          health_ok=0
          items_ok=0
          check /health && health_ok=1
          check /items && items_ok=1

          if [ "$health_ok" -eq 1 ] && [ "$items_ok" -eq 1 ]; then
            echo "Staging verified: /health and /items both returned 200."
            exit 0
          fi

          echo "Staging verification failed."
          exit 1
